{% extends "base.html" %}

{% block content %}

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <button id="new-chat-btn">
            + Nouveau chat
        </button>

        <div id="conversation-list">

            <!-- conversations injectées en JS -->

        </div>

    </aside>

    <!-- CHAT -->
    <section id="chat-box">

        <div class="chat-wrapper">

            <div id="messages"></div>

            <div id="input-area">

                <button id="upload-btn">📎</button>

                <!-- preview fichier -->
                <div id="file-preview" style="display: none;">
                    <span id="file-name"></span>
                    <button id="remove-file">✖</button>
                </div>

                <textarea
                    id="user-input"
                    placeholder="Écrire un message..."
                ></textarea>

                <button id="send-btn">
                    Envoyer
                </button>

            </div>

        </div>

    </section>

</div>

{% endblock %}
